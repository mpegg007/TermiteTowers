## For Node07 - Basic ESP32 (No Sensors Yet)
# esphome upload esp32-node07.yaml --device 192.168.1.XXX
# esphome logs esp32-node07.yaml --device 192.168.1.XXX
##esptool v5.0.2
##Connected to ESP32 on COM3:
##Chip type:          ESP32-D0WD-V3 (revision v3.1)
##Features:           Wi-Fi, BT, Dual Core + LP Core, 240MHz, Vref calibration in eFuse, Coding Scheme None
##Crystal frequency:  40MHz
##MAC:                14:08:08:a6:97:14

substitutions:
  friendly_name: "ESP32 Node07"

esphome:
  name: esp32-node07
  friendly_name: "${friendly_name}"
  on_boot:
    priority: -100  # Run after all components are initialized
    then:
      - logger.log: "ESP32 Node07 boot complete - KY-037 Audio Sensor Test Mode"
      - delay: 3s
      - logger.log: "Starting GPIO34 voltage monitoring..."
  on_loop:
    then:
      - delay: 1s
      - lambda: |-
          ESP_LOGI("gpio34", "GPIO34 Voltage: %.4f V", id(gpio34_test).state);

# Import common TermiteTowers ESP32 base configuration
<<: !include tt-esp-base.yaml

# Override logger to show sensor readings for diagnostic
logger:
  level: INFO
  logs:
    sensor: INFO  # Show sensor readings for diagnostic
    text_sensor: WARN  # Suppress text sensor debug messages
    adc: INFO  # Show ADC readings for diagnostic

# Override only the fallback AP name (keep base WiFi config)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp32-Node07"
    password: !secret fallback_ap_password

