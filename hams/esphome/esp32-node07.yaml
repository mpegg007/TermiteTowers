sensor:
  # DIAGNOSTIC TEST - GPIO34 floating pin test
  # Disconnect ALL wires from GPIO34 to see if ADC reads varying values
  - platform: adc
    pin: GPIO34  # ADC1_CH6 - Should read random voltages when floating
    name: "${friendly_name} GPIO34 Floating Test"
    id: gpio34_test
    update_interval: 1s  # Fast updates for monitoring
    accuracy_decimals: 4
    attenuation: auto

