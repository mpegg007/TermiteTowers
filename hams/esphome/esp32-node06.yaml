## For Node06 - Environmental Monitoring Station
# esphome upload esp32-node06.yaml --device 192.168.1.XXX
# esphome logs esp32-node06.yaml --device 192.168.1.XXX
##esptool v5.0.2
##Connected to ESP32 on COM3:
##Chip type:          ESP32-D0WD-V3 (revision v3.1)
##Features:           Wi-Fi, BT, Dual Core + LP Core, 240MHz, Vref calibration in eFuse, Coding Scheme None
##Crystal frequency:  40MHz
##MAC:                14:08:08:a5:14:d0

substitutions:
  friendly_name: "ESP32 Node06"

esphome:
  name: esp32-node06
  friendly_name: "${friendly_name}"

# Import common TermiteTowers ESP32 base configuration
<<: !include tt-esp-base.yaml

# Override only the fallback AP name (keep base WiFi config)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.129
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "Esp32-Node06"
    password: !secret fallback_ap_password

# ==============================================================================
# DEVICE-SPECIFIC SENSORS (Environmental Monitoring)
# ==============================================================================

sensor:
  # SHT3x Temperature & Humidity Sensor
  - platform: sht3xd
    temperature:
      name: "${friendly_name} Temperature"
      id: sht_temp
      accuracy_decimals: 2
    humidity:
      name: "${friendly_name} Humidity"
      id: sht_humidity
      accuracy_decimals: 1
    address: 0x44
    update_interval: 30s

  # BH1750 Digital Light Intensity Sensor (fixed - removed deprecated parameter)
  - platform: bh1750
    name: "${friendly_name} Light Intensity"
    id: light_sensor
    address: 0x23
    update_interval: 30s