# Base ESPHome Configuration
# This file contains shared settings that can be used across multiple ESP devices
# Import this in device-specific YAML files using: packages: !include base.yaml

# Global Substitutions - These can be overridden in device-specific configs
substitutions:
  # Default device settings - override these in device-specific configs
  device_name: "esp-device"
  friendly_name: "ESP Device"
  device_description: "ESP32 Device"
  
  # GPIO Pin Definitions - customize per device
  dht_pin: "4"
  relay_pin: "5"
  
  # Update intervals
  sensor_update_interval: "60s"
  fast_update_interval: "10s"

# ESPHome Core Configuration
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  
  # Platform-specific settings (override in device config if needed)
  platformio_options:
    upload_speed: 921600
    monitor_speed: 115200

# ESP32 Platform Configuration
esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging with configurable level
logger:
  level: INFO
  baud_rate: 115200

# Home Assistant API Configuration
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s  # Disable automatic reboot on API disconnect

# Over-The-Air Updates Configuration
ota:
  - platform: esphome
    password: !secret ota_password
    safe_mode: true
    reboot_timeout: 10min
    num_attempts: 5

# Wi-Fi Configuration with Fallback Access Point
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable Wi-Fi power save mode to reduce power consumption
  power_save_mode: light
  
  # Fallback hotspot in case Wi-Fi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

# Captive portal for easy Wi-Fi setup when using fallback AP
captive_portal:

# Web server for device status and control (optional, can be disabled for security)
web_server:
  port: 80
  version: 2
  include_internal: true

# Text sensors for device information
text_sensor:
  # ESPHome version information
  - platform: version
    name: "${friendly_name} ESPHome Version"
    icon: mdi:application-cog

  # Wi-Fi connection information
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      icon: mdi:ip-network
    ssid:
      name: "${friendly_name} Connected SSID"
      icon: mdi:wifi
    mac_address:
      name: "${friendly_name} Mac Address"
      icon: mdi:ethernet

# Basic sensors available on most ESP32 devices
sensor:
  # Wi-Fi Signal Strength
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: ${sensor_update_interval}
    icon: mdi:wifi-strength-2

  # Internal temperature sensor (ESP32 chip temperature)
  - platform: internal_temperature
    name: "${friendly_name} Internal Temperature"
    update_interval: ${sensor_update_interval}
    icon: mdi:thermometer

  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: ${sensor_update_interval}
    icon: mdi:timer-outline

# Binary sensors
binary_sensor:
  # Status indicator
  - platform: status
    name: "${friendly_name} Status"
    icon: mdi:check-circle

# Buttons for remote control
button:
  # Restart button
  - platform: restart
    name: "${friendly_name} Restart"
    icon: mdi:restart

  # Safe mode button (for troubleshooting)
  - platform: safe_mode
    name: "${friendly_name} Safe Mode"
    icon: mdi:shield-check
