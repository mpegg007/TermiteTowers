## For Node04 - Basic ESP32 (No Sensors Yet)
# esphome upload esp32-node04.yaml --device 192.168.1.XXX
# esphome logs esp32-node04.yaml --device 192.168.1.XXX
##esptool v5.0.2
##Connected to ESP32 on COM3:
##Chip type:          ESP32-D0WD-V3 (revision v3.1)
##Features:           Wi-Fi, BT, Dual Core + LP Core, 240MHz, Vref calibration in eFuse, Coding Scheme None
##Crystal frequency:  40MHz
##MAC:                38:18:2b:8a:c4:e8

substitutions:
  friendly_name: "ESP32 Node04"

esphome:
  name: esp32-node04
  friendly_name: "${friendly_name}"

# Import common TermiteTowers ESP32 base configuration
<<: !include tt-esp-base.yaml

# Override only the fallback AP name (keep base WiFi config)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp32-Node04"
    password: !secret fallback_ap_password

# ==============================================================================
# DEVICE-SPECIFIC CONFIGURATION
# ==============================================================================

# No additional sensors yet - just the base system sensors:
# - WiFi Signal Strength
# - Uptime
# - IP Address, SSID, MAC Address
# - ESPHome Version
#
# Ready for OTA updates to add sensors later