## For Boiler Room - ESP32 with SHT3x and 8-Relay Module
# esphome upload esp32-node03.yaml --device 192.168.1.XXX
# esphome logs esp32-node03.yaml --device 192.168.1.XXX

substitutions:
  friendly_name: "ESP32 Boiler Room"

esphome:
  name: esp32-boiler
  friendly_name: "${friendly_name}"

# Import common TermiteTowers ESP32 base configuration
<<: !include tt-esp-base.yaml

# Override only the fallback AP name (keep base WiFi config)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.130
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "Esp32-Boiler"
    password: !secret fallback_ap_password

# ==============================================================================
# DEVICE-SPECIFIC CONFIGURATION
# ==============================================================================

# SHT3x Temperature & Humidity Sensor (I2C)
sensor:
  - platform: sht3xd
    temperature:
      name: "Boiler Room Temperature"
      id: boiler_temp
    humidity:
      name: "Boiler Room Humidity"
      id: boiler_humidity
    address: 0x44
    update_interval: 30s

# Sainsmart 8-Relay Module (GPIOs)
switch:
  - platform: gpio
    name: "Boiler Relay 1"
    pin: GPIO18
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - logger.log: "WARNING: Boiler Relay 1 turned OFF"
    on_turn_on:
      - logger.log: "INFO: Boiler Relay 1 turned ON"
  - platform: gpio
    name: "Boiler Relay 2"
    pin: GPIO19
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - logger.log: "WARNING: Boiler Relay 2 turned OFF"
    on_turn_on:
      - logger.log: "INFO: Boiler Relay 2 turned ON"
  - platform: gpio
    name: "Boiler Relay 3"
    pin: GPIO27
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - logger.log: "WARNING: Boiler Relay 3 turned OFF"
    on_turn_on:
      - logger.log: "INFO: Boiler Relay 3 turned ON"
  - platform: gpio
    name: "Boiler Relay 4"
    pin: GPIO26
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - logger.log: "WARNING: Boiler Relay 4 turned OFF"
    on_turn_on:
      - logger.log: "INFO: Boiler Relay 4 turned ON"
  - platform: gpio
    name: "Boiler Relay 5"
    pin: GPIO25
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - logger.log: "WARNING: Boiler Relay 5 turned OFF"
    on_turn_on:
      - logger.log: "INFO: Boiler Relay 5 turned ON"
  - platform: gpio
    name: "Boiler Relay 6"
    pin: GPIO33
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - logger.log: "WARNING: Boiler Relay 6 turned OFF"
    on_turn_on:
      - logger.log: "INFO: Boiler Relay 6 turned ON"
    
# Notes:
# - Adjust relay GPIOs as needed for your wiring
# - All relays default to OFF at boot
# - SHT3x sensor uses I2C bus (GPIO21/22 from base config)