## For Boiler Room - ESP32 with SHT3x and 8-Relay Module
# esphome upload esp32-node03.yaml --device 192.168.1.XXX
# esphome logs esp32-node03.yaml --device 192.168.1.XXX

substitutions:
  friendly_name: "ESP32 Boiler Room"

esphome:
  name: esp32-boiler
  friendly_name: "${friendly_name}"

# Import common TermiteTowers ESP32 base configuration
<<: !include tt-esp-base.yaml

# Override only the fallback AP name (keep base WiFi config)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp32-Boiler"
    password: !secret fallback_ap_password

# ==============================================================================
# DEVICE-SPECIFIC CONFIGURATION
# ==============================================================================

# SHT3x Temperature & Humidity Sensor (I2C)
sensor:
  - platform: sht3xd
    temperature:
      name: "Boiler Room Temperature"
      id: boiler_temp
    humidity:
      name: "Boiler Room Humidity"
      id: boiler_humidity
    address: 0x44
    update_interval: 30s

# Sainsmart 8-Relay Module (GPIOs)
switch:
  - platform: gpio
    name: "Boiler Relay 1"
    pin: GPIO18
  - platform: gpio
    name: "Boiler Relay 2"
    pin: GPIO19
  - platform: gpio
    name: "Boiler Relay 3"
    pin: GPIO27
  - platform: gpio
    name: "Boiler Relay 4"
    pin: GPIO26
  - platform: gpio
    name: "Boiler Relay 5"
    pin: GPIO25
  - platform: gpio
    name: "Boiler Relay 6"
    pin: GPIO33

# Notes:
# - Adjust relay GPIOs as needed for your wiring
# - All relays default to OFF at boot
# - SHT3x sensor uses I2C bus (GPIO21/22 from base config)