## MINIMAL TEST - No includes, just basic I2S
substitutions:
  friendly_name: "ESP32 Node07 Minimal"

esphome:
  name: esp32-node07-minimal
  friendly_name: "${friendly_name}"
  platform: ESP32
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  platform: esphome

# MINIMAL I2S TEST
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO27
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left

sensor:
  - platform: template
    name: "${friendly_name} Mic Test"
    update_interval: 1s
    lambda: |-
      if (id(mic)->is_running()) {
        return 1.0; // Working
      } else {
        return 0.0; // Not working
      }