# secrets-patterns.conf: Custom secret scanning patterns
# One pattern per line. Format: regex|severity|description
# Lines starting with # are ignored.

# Kea DHCP database passwords (JSON format)
"password"\s*:\s*"(?!\$)[^"]+"|high|Hardcoded database password in Kea config (JSON)

# Kea DHCP database passwords (key=value format)
password\s*=\s*(?!\$\{?)[^\s;,#]+|high|Hardcoded database password (key=value)

# Add more patterns below:
# API_KEY\s*=\s*["'][^"']+["']|high|Hardcoded API key
# SECRET_TOKEN\s*=\s*[a-zA-Z0-9]{32,}|critical|Hardcoded secret token