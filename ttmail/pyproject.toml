[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ttmail"
version = "0.1.0"
description = "TermiteTowers .env layer over the awmail package"
requires-python = ">=3.10"
# Sending, receiving, the allow-list, rate caps and loop refusal all live in
# awmail. ttmail only adds a .env loader and variable-name translation.
dependencies = ["awmail>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ttmail = "ttmail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
