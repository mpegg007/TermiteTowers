theme:
  name: material
  language: en
  # `font: false` keeps the stock Material styling but drops the Google Fonts
  # request. On a LAN-only host fonts.gstatic.com is often blocked, which cost
  # a slow blocked round trip before first paint.
  font: false
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # `navigation.instant` is deliberately omitted: it swaps pages over XHR and
    # does not cooperate with the live reload used by `mkdocs serve`. Re-add it
    # only if this site ever moves to a static build behind nginx.
    #
    # `navigation.expand` is deliberately omitted: it has no effect while
    # `navigation.sections` is enabled, which is what renders the sidebar.
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

docs_dir: wiki

# Render only Markdown docs (plus the stylesheet). The `infra`, `hams`, and
# `git-automation` symlinks pull in their entire source trees, which include
# live secrets (infra/docker/env/*.env, hams/esphome/secrets.yaml, MCP
# config.json tokens) and non-doc files (scripts, *.py, *.json, *.csv,
# systemd units, cross-repo symlinks). Publishing only `*.md` keeps the site
# to documentation and guarantees no secret leaks.
#
# DO NOT remove the `!assets/**` line. MkDocs adds the theme's own files to the
# same File collection that `exclude_docs` filters (see build.py:
# `files.add_files_from_theme(...)` followed by `set_exclusions(...)`), so the
# theme's CSS and JS land at source paths like `assets/stylesheets/main.*.css`.
# A catch-all `*` therefore excludes Material's stylesheet itself, and the site
# renders as unstyled HTML: header, sidebar and search markup present but no
# styling. That is exactly what happened here. `assets/**` re-admits the theme
# bundle while `*` still keeps every other non-Markdown path out, so the secret
# guarantee above holds. Verified: with this block the build publishes only
# *.html, stylesheets/extra.css, sitemap.xml(.gz) and MkDocs' search index.
#
# Note also that dot-directories are excluded by MkDocs by default (`.*` in its
# `_default_exclude`), which is what keeps the thousands of vendored
# `hams/esphome/.esphome/**/README.md` files out of the site.
exclude_docs: |
  *
  !*.md
  !**/*.md
  !stylesheets/**
  !assets/**

# Explicit `nav:` above replaces auto-discovery. New pages must be added to it,
# otherwise they build but stay unreachable from the navigation.
