# User logrotate configuration for git hooks
# Maintained in repository, symlinked to ~/.logrotate.conf
# This file is the main logrotate config that includes configs from logrotate.d/

# Include repository-specific logrotate configs via /srv/dev1 symlink
include /srv/dev1/logrotate/logrotate.d

# Global defaults (can be overridden per-log)
compress
compresscmd /usr/bin/gzip
compressext .gz
dateext
dateformat -%Y%m%d-%H%M%S
