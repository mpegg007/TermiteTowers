# Backup jobs (often larger): rotate by size, large retention
/var/log/tt-backup-*.log {
    su root adm
    size 50M
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Health checks / monitoring (small, frequent): rotate weekly
/var/log/tt-*-health-*.log {
    su root adm
    weekly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Rare jobs (run weekly/monthly): rotate monthly
/var/log/tt-*-monthly.log {
    su root adm
    monthly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Specific app logs that are NOT health checks or backups
/var/log/tt-kea-watchdog-*.log /var/log/tt-kea-config-*.log {
    su root adm
    weekly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Nextcloud application log, on NVMe outside the backed-up data tree.
#
# Nextcloud rotates its own log at log_rotate_size (100 MB, set with
# `occ config:system:set log_rotate_size --value=104857600 --type=integer`).
# This stanza is the backstop for when that fails: the previous instance grew a
# 2.8 GB nextcloud.log that nothing rotated.
#
# copytruncate, not create+rename: the PHP process holds this file open and
# cannot be signalled from the host. Copying then truncating avoids the window
# where Nextcloud keeps writing to an inode that has already been renamed away.
#
# `su www-data tt-ai-storage` runs the rotation as the file owner, which is what
# the 0640 www-data:tt-ai-storage mode requires.
/mnt/ai_storage/nextcloud/log/nextcloud.log {
    su www-data tt-ai-storage
    size 100M
    rotate 20
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    copytruncate
}
