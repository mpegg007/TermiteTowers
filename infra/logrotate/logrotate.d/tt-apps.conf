# Backup jobs (often larger): rotate by size, large retention
/var/log/tt-backup-*.log {
    su root adm
    size 50M
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Health checks / monitoring (small, frequent): rotate weekly
/var/log/tt-*-health-*.log {
    su root adm
    weekly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Rare jobs (run weekly/monthly): rotate monthly
/var/log/tt-*-monthly.log {
    su root adm
    monthly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}

# Specific app logs that are NOT health checks or backups
/var/log/tt-kea-watchdog-*.log /var/log/tt-kea-config-*.log {
    su root adm
    weekly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    olddir /var/log/tt-archives
    create 640 root adm
}
