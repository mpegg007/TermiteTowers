# Logrotate configuration for git hook logs
# Rotates logs in $HOME/log/ for all repos using enhanced git hooks

# Pattern matches all repo-specific git hook logs
/home/mpegg-adm/log/*-enhanced-hooks.log {
    # Rotate when file exceeds 10MB
    size 10M
    
    # Keep last 5 rotated logs
    rotate 5
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if file is empty
    notifempty
    
    # Compress rotated logs
    compress
    
    # Delay compression until next rotation (keeps most recent backup uncompressed)
    delaycompress
    
    # Create new log file after rotation with these permissions
    create 0644
    
    # Use date extension for rotated files (instead of .1, .2, etc.)
    dateext
    dateformat -%Y%m%d-%H%M%S
    
    # Don't rotate if file was already rotated recently (prevents multiple rotations per day)
    maxage 365
}
