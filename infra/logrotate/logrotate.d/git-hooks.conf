# Logrotate configuration for git hook logs
# Rotates logs in /home/mpegg-adm/log/ for all repos using enhanced git hooks

# Pattern matches all repo-specific git hook logs
/home/mpegg-adm/log/*-enhanced-hooks.log {
    # Run as the user to handle permissions correctly
    su mpegg-adm mpegg-adm

    # Rotate when file exceeds 10MB
    size 10M
    
    # Keep last 5 rotated logs
    rotate 5
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if file is empty
    notifempty
    
    # Compress rotated logs
    compress
    
    # Delay compression until next rotation
    delaycompress
    
    # Create new log file after rotation with these permissions and ownership
    create 0644 mpegg-adm mpegg-adm
    
    # Use date extension for rotated files
    dateext
    dateformat -%Y%m%d-%H%M%S
    
    # Move rotated logs to a separate archive directory
    olddir /home/mpegg-adm/log/archives

    # Don't rotate if file was already rotated recently
    maxage 365
}
