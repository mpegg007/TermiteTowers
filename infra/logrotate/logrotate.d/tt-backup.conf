# Logs for the unprivileged tt-backup service account (Database + app backups).
#
# Deployment: COPY (not symlink) into /etc/logrotate.d/tt-backup.conf
#   sudo install -m 0644 /home/mpegg-adm/source/TermiteTowers/infra/logrotate/logrotate.d/tt-backup.conf /etc/logrotate.d/tt-backup.conf
#   sudo logrotate -d /etc/logrotate.conf   # dry-run
#
# WHY A SEPARATE DIRECTORY INSTEAD OF /var/log/tt-backup-*.log:
#   /etc/logrotate.d/tt-apps already owns the glob /var/log/tt-backup-*.log
#   with "su root adm" + "create 640 root adm". That cannot work for a
#   non-root writer: logrotate would recreate the log root:adm and the next
#   run of the tt-backup service could no longer append to it. Overlapping
#   globs would also trigger logrotate's "duplicate log entry" error. So this
#   fragment owns /var/log/tt-backup/ (created by LogsDirectory=tt-backup in
#   tt-backup-tthealth.service) and rotates as the tt-backup account itself.
#
# No "olddir" here: /var/log/tt-archives is root-owned and not writable by
# tt-backup, so archives stay alongside the live log in /var/log/tt-backup/.
/var/log/tt-backup/*.log {
    su tt-backup tt-backup
    weekly
    rotate 5200
    compress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    create 0640 tt-backup tt-backup
}
