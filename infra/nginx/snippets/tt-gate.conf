# tt-gate.conf — the single switch for Authelia forward-auth on the
# analacres.ca service family (memorylab, wordbank, soundbank, ...).
#
# ─────────────────────────────────────────────────────────────────────────────
# PHASE 1 — INERT. This file contains comments only, so including it is a
# no-op. Every vhost that will eventually be gated already includes it, inside
# the `location` block that must be protected. Enabling the gate is therefore
# a change to THIS FILE ONLY — no vhost is edited.
#
# Do not move these directives up to `server` level. `error_page 401` would
# then be inherited by the exempt /api/ and /rest/ locations, and a 401 from
# AudioBookshelf or Navidrome would be rewritten into a redirect to the portal
# instead of reaching the native client that expects it. That is why the gate
# lives in the protected location and the exempt locations simply do not
# include this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# TO ENABLE (after Authelia is running — see wiki/runbook-authelia.md):
#
#   1. Replace the body of this file with the "ACTIVE BODY" at the bottom.
#   2. sudo nginx -t
#   3. sudo systemctl reload nginx
#
# TO DISABLE (break-glass): replace the body with comments again and reload.
# The exempt locations keep working throughout, so native clients are
# unaffected either way.
# ─────────────────────────────────────────────────────────────────────────────
#
# Requires that snippets/tt-gate-location.conf is included at server level in
# the same vhost: it defines the internal /internal/tt-authz target that
# auth_request calls. Requests are routed to it by longest-prefix match, so it
# never re-enters the protected location and cannot loop.
#
# ─────────────────────────────────────────────────────────────────────────────
# ACTIVE BODY — paste over the comments above (keep them in the repo history).
# ─────────────────────────────────────────────────────────────────────────────
#
# ## Ask Authelia whether this request carries a valid session.
# auth_request /internal/tt-authz;
#
# ## Capture Authelia's identity headers so the backend can read them.
# auth_request_set $tt_user   $upstream_http_remote_user;
# auth_request_set $tt_groups $upstream_http_remote_groups;
# auth_request_set $tt_name   $upstream_http_remote_name;
# auth_request_set $tt_email  $upstream_http_remote_email;
#
# ## Forward that identity to the application (it may ignore it; harmless).
# proxy_set_header Remote-User   $tt_user;
# proxy_set_header Remote-Groups $tt_groups;
# proxy_set_header Remote-Name   $tt_name;
# proxy_set_header Remote-Email  $tt_email;
#
# ## Unauthenticated requests: Authelia returns the portal URL in its Location
# ## header (its "Modern Method"), which is simpler and safer than rebuilding
# ## the redirect here, and it survives a change of portal hostname.
# auth_request_set $tt_redirection_url $upstream_http_location;
# error_page 401 =302 $tt_redirection_url;
