# tt-gate-location.conf — the target that snippets/tt-gate.conf calls.
#
# Include this ONCE per vhost, at `server` level, in every vhost that may be
# gated. It is safe and inert on its own:
#
#   * `internal;` means it can only be reached by an nginx subrequest, never
#     by a client. It returns 404 to anyone who types the path.
#   * `auth_request off;` is belt-and-braces: if a future edit ever moves the
#     gate directives to server level, this stops the subrequest from
#     re-entering the gate and looping.
#
# The address is the loopback publish of the Authelia container. Authelia is
# never exposed directly; nginx on the host is the only client and reaches it
# over loopback (see wiki/runbook-authelia.md and wiki/ports.md).
#
# Port 3530 is the reserved "Auth/SSO" slot. Container-internal it is 9091.

location = /internal/tt-authz {
    internal;
    auth_request off;

    proxy_pass http://127.0.0.1:3530/api/authz/auth-request;
    proxy_pass_request_body off;

    # The subrequest must not carry a body or its length.
    proxy_set_header Content-Length "";

    # Authelia derives method, scheme, host and path from these.
    proxy_set_header X-Original-URL     $scheme://$host$request_uri;
    proxy_set_header X-Original-Method  $request_method;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-URI    $request_uri;
    proxy_set_header X-Forwarded-For    $remote_addr;

    # Fail closed and quickly if Authelia is down: a hung authz call must not
    # hold every request open.
    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;
    proxy_send_timeout    5s;
}
