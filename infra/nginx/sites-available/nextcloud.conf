# Nextcloud — published as filebank.analacres.ca
#
# ─────────────────────────────────────────────────────────────────────────────
# Why this file has three server blocks sharing one backend (127.0.0.1:3230):
#
#   nextcloud.termitetowers.ca  port 80   permanent redirect to the new name
#   nextcloud.termitetowers.ca  port 443  permanent redirect to the new name
#   filebank.analacres.ca       port 3261 the real service
#
# The analacres.ca family does not arrive on 443 — all of its hostnames share
# one TLS listener, port 3261, selected by SNI, each with its own per-host
# certificate. See wiki/domains.md. The old termitetowers name keeps its 443
# listener and its existing certificate only so that old links and enrolled
# clients still resolve; it serves nothing but a redirect.
#
# Gate readiness: `location /` includes snippets/tt-gate.conf, which is INERT
# until Authelia is deployed. The client-facing prefixes below deliberately do
# NOT include it, because they authenticate per request with app passwords or
# are public share links, and a browser redirect gate would break them:
#
#   /remote.php/   WebDAV and desktop/mobile sync, app passwords
#   /public.php/   public share links opened by people with no account
#   /ocs/          OCS API used by clients
#   /status.php    client capability probe
#   /login, /index.php/login   the login page itself
#   /apps/theming/, /dist/, /core/   static assets needed before login
#
# Getting this set wrong breaks desktop sync in a way that looks like a network
# fault, so it is written down here rather than inferred at flip time.
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Retired name: plain HTTP ────────────────────────────────────────────────
server {
    listen 80;
    server_name nextcloud.termitetowers.ca;

    return 301 https://filebank.analacres.ca$request_uri;
}

# ── Retired name: HTTPS, kept only to redirect ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name nextcloud.termitetowers.ca;

    ssl_certificate     /etc/letsencrypt/live/termitetowers.ca-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca-0001/privkey.pem;

    return 301 https://filebank.analacres.ca$request_uri;
}

# ── The service ─────────────────────────────────────────────────────────────
server {
    listen 3261 ssl;
    server_name filebank.analacres.ca;

    ssl_certificate     /etc/letsencrypt/live/filebank.analacres.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filebank.analacres.ca/privkey.pem;

    # Defines the internal /internal/tt-authz target that the gate calls.
    # Harmless while inert: `internal` makes it unreachable from a client.
    include /etc/nginx/snippets/tt-gate-location.conf;

    # Uploads: 16 G matches the previous working configuration.
    client_max_body_size 16G;
    proxy_request_buffering off;
    client_body_buffer_size 1024k;
    proxy_max_temp_file_size 0;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ── CalDAV / CardDAV / webfinger discovery ──────────────────────────────
    # Nextcloud's own documented redirects. Without these, clients that probe
    # .well-known fail to configure themselves.
    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location ^~ /.well-known/webfinger {
        return 301 $scheme://$host/index.php$uri;
    }

    location ^~ /.well-known/nodeinfo {
        return 301 $scheme://$host/index.php$uri;
    }

    # ── Client-facing, EXEMPT from the gate, never add tt-gate.conf here ────
    location /remote.php/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location /public.php/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location /ocs/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location = /status.php {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location ^~ /index.php/login {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location ^~ /apps/theming/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location ^~ /dist/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    location ^~ /core/ {
        auth_request off;
        proxy_pass http://127.0.0.1:3230;
    }

    # ── Web UI — protected after the Authelia flip ──────────────────────────
    location / {
        include /etc/nginx/snippets/tt-gate.conf;

        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
