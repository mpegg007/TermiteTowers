# Water Meter Viewer (dev1) — reverse proxy to the local FastAPI webapp.
# The app itself binds 127.0.0.1:3414 (see water-meter/systemd/water-meter.service).
#
# OPTIONAL: this site is NOT enabled by default (localhost-only access).
# To expose it on a hostname:
#   1. Add a DNS CNAME for water-meter.<domain> -> this host.
#   2. Enable the site:  sudo scripts/nginx-enable-site.sh water-meter.conf
#   3. Issue a cert:    sudo certbot --nginx -d water-meter.<domain>
#   4. Reload:          sudo nginx -t && sudo systemctl reload nginx
#
# Location: /etc/nginx/sites-available/water-meter.conf
server {
    listen 80;
    server_name water-meter.termitetowers.ca water.termitetowers.ca;

    location / {
        proxy_pass http://127.0.0.1:3414;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
