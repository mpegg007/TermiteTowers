# TensorFlow Jupyter Reverse Proxy Configuration
# Service: TensorFlow Jupyter Notebook server
# Backend: http://localhost:3810
# Public URL: https://tensorflow.termitetowers.ca

server {
    listen 443 ssl http2;
    server_name tensorflow.termitetowers.ca;

    # SSL Configuration (managed by certbot or your SSL setup)
    ssl_certificate /etc/letsencrypt/live/termitetowers.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/tensorflow-access.log;
    error_log /var/log/nginx/tensorflow-error.log;

    # Increase client body size for notebook uploads
    client_max_body_size 100M;

    # Proxy settings
    location / {
        proxy_pass http://localhost:3810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (required for Jupyter)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts (longer for notebook operations)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering
        proxy_buffering off;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name tensorflow.termitetowers.ca;
    return 301 https://$server_name$request_uri;
}
