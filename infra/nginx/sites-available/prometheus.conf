# Prometheus Reverse Proxy Configuration
# Service: Prometheus monitoring and alerting
# Backend: http://localhost:3720
# Public URL: https://prometheus.termitetowers.ca

server {
    listen 443 ssl http2;
    server_name prometheus.termitetowers.ca;

    # Gate-ready: `location /` includes snippets/tt-gate.conf, which is INERT
    # until Authelia is deployed. See wiki/runbook-authelia.md.
    include /etc/nginx/snippets/tt-gate-location.conf;

    # SSL Configuration (managed by certbot or your SSL setup)
    ssl_certificate     /etc/letsencrypt/live/termitetowers.ca-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca-0001/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/prometheus-access.log;
    error_log /var/log/nginx/prometheus-error.log;

    # Proxy settings
    location / {
        include /etc/nginx/snippets/tt-gate.conf;

        # Immediate protection, because tt-gate.conf is inert until Authelia
        # lands. Prometheus has no authentication of its own, and its API
        # exposes scrape targets, the live config and the whole metric history.
        # The htpasswd file is created on the host from per-tier secrets and is
        # never committed. See wiki/runbook-prometheus.md.
        auth_basic "prometheus";
        auth_basic_user_file /etc/nginx/htpasswd-prometheus;

        # 127.0.0.1, not localhost: the container publishes on the IPv4
        # loopback only, and "localhost" can resolve to ::1 first.
        proxy_pass http://127.0.0.1:3720;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name prometheus.termitetowers.ca;
    return 301 https://$server_name$request_uri;
}
