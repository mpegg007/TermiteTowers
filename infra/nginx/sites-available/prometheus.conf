# Prometheus Reverse Proxy Configuration
# Service: Prometheus monitoring and alerting
# Backend: http://localhost:3720
# Public URL: https://prometheus.termitetowers.ca

server {
    listen 443 ssl http2;
    server_name prometheus.termitetowers.ca;

    # SSL Configuration (managed by certbot or your SSL setup)
    ssl_certificate /etc/letsencrypt/live/termitetowers.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca/privkey.pem;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/prometheus-access.log;
    error_log /var/log/nginx/prometheus-error.log;

    # Proxy settings
    location / {
        proxy_pass http://localhost:3720;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name prometheus.termitetowers.ca;
    return 301 https://$server_name$request_uri;
}
