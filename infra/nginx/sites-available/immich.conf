#
# ─────────────────────────────────────────────────────────────────────────────
# Two vhosts share this file because they share one backend:
#
#   pics.justanotherhuman.ca    ungated. Kept byte-for-byte equivalent to the
#                               previous shared block. Real pics traffic is
#                               served from https://justanotherhuman.ca:3260/
#                               pics/ (see justanotherhuman.conf); this
#                               server_name is retained because it predates
#                               that and nothing here may change its behaviour.
#
#   memorylab.analacres.ca      gate-ready. `location /` includes
#                               snippets/tt-gate.conf, which is INERT until
#                               Authelia is deployed. See wiki/runbook-authelia.md.
#
# They were one block serving both names. They are split because the gate is
# applied per vhost: gating one server_name out of a shared block would have
# gated the other. This split is the only structural change Phase 1 makes to
# this file, and it is why enabling the gate later requires no vhost edit.
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ═════════════════════════════════════════════════════════════════════════════
# pics.justanotherhuman.ca — UNGATED, behaviour unchanged
# ═════════════════════════════════════════════════════════════════════════════
server {
    listen 3261 ssl;
    server_name pics.justanotherhuman.ca;

    ssl_certificate     /etc/letsencrypt/live/memorylab.analacres.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorylab.analacres.ca/privkey.pem;

    client_max_body_size 50000M;
    proxy_request_buffering off;
    client_body_buffer_size 1024k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ── AI Tag Viewer static files ──────────────────────────────────────
    location /tag-viewer/ {
        alias /var/www/tag-viewer/;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── AI Tag API backend ──────────────────────────────────────────────
    location /api/tags/ {
        proxy_pass http://localhost:3410;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Immich proxy with script injection ──────────────────────────────
    location / {
        proxy_pass http://localhost:3400/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Required for sub_filter: buffer response + prevent gzip
        proxy_buffering on;
        proxy_set_header Accept-Encoding "";

        # Inject the AI Tag Viewer button script into every page
        sub_filter '</head>' '<script src="/tag-viewer/inject.js"></script></head>';
        sub_filter_once on;
    }
}

# ═════════════════════════════════════════════════════════════════════════════
# memorylab.analacres.ca — GATE-READY (gate currently inert)
#
# Exemptions, and why each one exists:
#   /api/          the Immich mobile app authenticates per request against the
#                  API with its own token. It cannot answer a browser redirect,
#                  so it must never be gated.
#   /api/tags/     a LONGER prefix than /api/, so nginx routes it here first.
#                  It DOES include the gate: the AI tag backend is
#                  browser-facing and must stay behind the portal after the
#                  flip. Removing this location would silently open it.
#   /tag-viewer/   static assets for the injected button; browser only.
#   /              everything else, including the web UI.
# ═════════════════════════════════════════════════════════════════════════════
server {
    listen 3261 ssl;
    server_name memorylab.analacres.ca;

    ssl_certificate     /etc/letsencrypt/live/memorylab.analacres.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorylab.analacres.ca/privkey.pem;

    # Defines /internal/tt-authz — the target the gate calls. Harmless while
    # inert: `internal` makes it unreachable from a client.
    include /etc/nginx/snippets/tt-gate-location.conf;

    client_max_body_size 50000M;
    proxy_request_buffering off;
    client_body_buffer_size 1024k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ── AI Tag Viewer static files — protected after the flip ───────────
    location /tag-viewer/ {
        include /etc/nginx/snippets/tt-gate.conf;

        alias /var/www/tag-viewer/;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── AI Tag API backend — protected after the flip ───────────────────
    location /api/tags/ {
        include /etc/nginx/snippets/tt-gate.conf;

        proxy_pass http://localhost:3410;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Immich API — EXEMPT, never gated ────────────────────────────────
    # No trailing URI on proxy_pass, so /api/... reaches Immich unmodified.
    # (A trailing slash here would strip the /api prefix and break the app.)
    location /api/ {
        auth_request off;

        proxy_pass http://localhost:3400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Immich's socket.io endpoint lives here: /api/socket.io
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Immich web UI — protected after the flip ────────────────────────
    location / {
        include /etc/nginx/snippets/tt-gate.conf;

        proxy_pass http://localhost:3400/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Required for sub_filter: buffer response + prevent gzip
        proxy_buffering on;
        proxy_set_header Accept-Encoding "";

        # Inject the AI Tag Viewer button script into every page
        sub_filter '</head>' '<script src="/tag-viewer/inject.js"></script></head>';
        sub_filter_once on;
    }
}
