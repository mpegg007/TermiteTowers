server {
    listen 80;
    server_name chat.termitetowers.ca;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Chat landing page - doesnt actually work
server {
    listen 443 ssl http2;
    server_name chat.termitetowers.ca;

    ssl_certificate     /etc/letsencrypt/live/termitetowers.ca-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca-0001/privkey.pem;

    root /var/www/chat;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
