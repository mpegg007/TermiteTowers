#
# AudioBookshelf. Two vhosts, one backend (bosman 192.168.4.63:13378):
#
#   library.termitetowers.ca   original, on 443, UNGATED. Unchanged.
#   wordbank.analacres.ca      new, on the 3261 analacres.ca listener, and
#                              GATE-READY: `location /` includes
#                              snippets/tt-gate.conf, inert until Authelia is
#                              deployed. See wiki/runbook-authelia.md.

# ─────────────────────────────────────────────────────────────────────────────
# library.termitetowers.ca — unchanged
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name library.termitetowers.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name library.termitetowers.ca;

    ssl_certificate     /etc/letsencrypt/live/termitetowers.ca-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca-0001/privkey.pem;

    location / {
        proxy_pass http://192.168.4.63:13378/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# wordbank.analacres.ca — GATE-READY (gate currently inert)
#
# Listener: 3261, the analacres.ca family port, matching memorylab. The A
# record is published by infra/dns/godaddy-ddns.sh; the certificate is issued
# per-host with the GoDaddy DNS-01 hooks (see infra/nginx/README.md).
#
# Exemptions, and why each one exists:
#   /api/        the AudioBookshelf mobile app logs in and then authenticates
#                per request with its own bearer token. It cannot answer a
#                browser redirect, so the API must never be gated.
#   /socket.io/  the app's realtime channel; same constraint as /api/.
#   /            everything else, including the web player.
#
# Not exempt, and deliberately so: share links (/public/...) and OPDS
# (/opds). Both are client-facing and currently unused here. If either is
# turned on later, it needs its own exemption or it will break after the flip.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 3261 ssl;
    server_name wordbank.analacres.ca;

    ssl_certificate     /etc/letsencrypt/live/wordbank.analacres.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wordbank.analacres.ca/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Defines /internal/tt-authz — the target the gate calls. Harmless while
    # inert: `internal` makes it unreachable from a client.
    include /etc/nginx/snippets/tt-gate-location.conf;

    # Audiobook and cover uploads are large; the default 1m would reject them.
    client_max_body_size 2048m;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;

    # Long-lived streaming responses must not be cut short mid-chapter.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ── AudioBookshelf API — EXEMPT, never gated ────────────────────────
    # No trailing URI on proxy_pass, so /api/... reaches the app unmodified.
    # (A trailing slash would strip the /api prefix and break every client.)
    location /api/ {
        auth_request off;

        proxy_pass http://192.168.4.63:13378;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── AudioBookshelf realtime channel — EXEMPT, never gated ───────────
    location /socket.io/ {
        auth_request off;

        proxy_pass http://192.168.4.63:13378;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── AudioBookshelf web UI — protected after the flip ────────────────
    location / {
        include /etc/nginx/snippets/tt-gate.conf;

        proxy_pass http://192.168.4.63:13378/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
