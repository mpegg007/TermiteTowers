server {
    listen 3259;
    server_name justanotherhuman.ca www.justanotherhuman.ca;
    return 301 https://justanotherhuman.ca$request_uri;
}


server {
    listen 3260 ssl;
    server_name justanotherhuman.ca www.justanotherhuman.ca;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- TLS hardening ---
    ssl_certificate     /etc/letsencrypt/live/justanotherhuman.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justanotherhuman.ca/privkey.pem;

    ssl_session_tickets off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP: static site + proxied images under /pics/

    root /var/www/justanotherhuman;
    index index.html;

    # --- /pics/ reverse proxy ---
    location ^~ /pics/ {
        proxy_pass http://127.0.0.1:3370/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static only, no fallback
    location / {
        try_files $uri $uri/ =404;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}

