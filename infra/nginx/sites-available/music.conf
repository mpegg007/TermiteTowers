#
# Navidrome. Two vhosts, one backend (bosman 192.168.4.63:4533):
#
#   music.termitetowers.ca   original, on 443, UNGATED. Unchanged.
#   soundbank.analacres.ca   new, on the 3261 analacres.ca listener, and
#                            GATE-READY: `location /` includes
#                            snippets/tt-gate.conf, inert until Authelia is
#                            deployed. See wiki/runbook-authelia.md.

# ─────────────────────────────────────────────────────────────────────────────
# music.termitetowers.ca — unchanged
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name music.termitetowers.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name music.termitetowers.ca;

    ssl_certificate     /etc/letsencrypt/live/termitetowers.ca-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca-0001/privkey.pem;

    location / {
        proxy_pass http://192.168.4.63:4533/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# soundbank.analacres.ca — GATE-READY (gate currently inert)
#
# Listener: 3261, the analacres.ca family port, matching memorylab. The A
# record is published by infra/dns/godaddy-ddns.sh; the certificate is issued
# per-host with the GoDaddy DNS-01 hooks (see infra/nginx/README.md).
#
# Exemptions, and why each one exists:
#   /rest/   the Subsonic API. Every Navidrome client — the official app,
#            play:Sub, substreamer, Symfonium, Sonixd — authenticates per
#            request with Subsonic token credentials over this prefix, and
#            streams audio from /rest/stream. A browser redirect here would
#            break all of them, so it must never be gated.
#   /        everything else, including the web UI and its assets.
#
# Not exempt, and deliberately so: public share links (/share/...) and the web
# UI's realtime channel. If share links are in use, /share/ needs its own
# exemption before the flip; if live UI updates break afterwards, the channel
# path does too. Both are verified in the test matrix rather than guessed.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 3261 ssl;
    server_name soundbank.analacres.ca;

    ssl_certificate     /etc/letsencrypt/live/soundbank.analacres.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soundbank.analacres.ca/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Defines /internal/tt-authz — the target the gate calls. Harmless while
    # inert: `internal` makes it unreachable from a client.
    include /etc/nginx/snippets/tt-gate-location.conf;

    # Subsonic clients stream for a long time on one request.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;

    # ── Subsonic API — EXEMPT, never gated ──────────────────────────────
    # No trailing URI on proxy_pass, so /rest/... reaches Navidrome unmodified.
    location /rest/ {
        auth_request off;

        proxy_pass http://192.168.4.63:4533;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Navidrome web UI — protected after the flip ─────────────────────
    location / {
        include /etc/nginx/snippets/tt-gate.conf;

        proxy_pass http://192.168.4.63:4533/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
