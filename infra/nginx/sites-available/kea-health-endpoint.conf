# Kea Health Check HTTP Endpoint for Uptime Kuma
# Location: /etc/nginx/sites-available/kea-health-endpoint.conf
# Enable: sudo ln -s /etc/nginx/sites-available/kea-health-endpoint.conf /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8765;
    server_name localhost;

    location /health/kea {
        # Execute health check and return result
        # This uses fcgiwrap or you can create a simple systemd socket service
        proxy_pass http://127.0.0.1:9001/health/kea;
        proxy_set_header Host $host;
    }
}

