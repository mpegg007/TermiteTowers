server {
    listen 80;
    server_name media.termitetowers.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name media.termitetowers.ca;

    ssl_certificate     /etc/letsencrypt/live/termitetowers.ca-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termitetowers.ca-0001/privkey.pem;

    root /var/www/media;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
