# DHCP Server Configuration
# Configuration for deploying DHCP configurations to servers

# DHCP Servers - Update these with your actual server IPs/hostnames
DHCP_SERVERS="192.168.1.250"

# SSH Configuration
DHCP_USER="root"  # Update with your DHCP server SSH user
SSH_KEY="$HOME/.ssh/id_rsa"  # Update path to your SSH key

# DHCP Service Configuration
DHCP_CONFIG_PATH="/etc/dhcp/dhcpd.conf"
DHCP_SERVICE_NAME="isc-dhcp-server"

# Backup Settings
BACKUP_RETENTION_DAYS=30

# Notification Settings (optional)
NOTIFICATION_EMAIL=""  # Email for deployment notifications
SLACK_WEBHOOK=""       # Slack webhook for notifications
