// Kea DHCP-DDNS Configuration
// Manages dynamic DNS updates to PowerDNS authoritative server
// Updates forward zones (.tt.omp, .aa.omp, .omp, .tt.sjd, .aa.sjd, .sjd) and reverse zones

{
"DhcpDdns": {
  // Listen address and port for DDNS update requests from Kea DHCP
  "ip-address": "192.168.1.10",
  "port": 53001,
  
  "control-socket": {
    "socket-type": "unix",
    "socket-name": "/var/run/kea/kea-ddns-ctrl-socket"
  },

  // TSIG keys for secure DNS updates
//  "tsig-keys": [
//    {
//      "name": "kea-ddns-key",
//      "algorithm": "hmac-sha256",
//      "secret": "dT1XsA8MgECIE+8kDhGAfaRx/dVecroX1r3OlS5pxkg="
//    }
//  ],

  // Forward DNS updates - add A records (hostname → IP)
  // ONLY updates kea.tt.omp subdomain - does NOT touch tt.omp, aa.omp, or omp zones
  "forward-ddns": {
    "ddns-domains": [
      {
        "name": "kea.tt.omp.",
        "dns-servers": [{"ip-address": "192.168.1.10", "port": 3053}]
      }
    ]
  },

  // Reverse DNS updates - add PTR records (IP → hostname)
  "reverse-ddns": {
    "ddns-domains": [
      {
        "name": "1.168.192.in-addr.arpa.",
        "dns-servers": [{"ip-address": "192.168.1.10", "port": 3053}]
      },
      {
        "name": "4.168.192.in-addr.arpa.",
        "dns-servers": [{"ip-address": "192.168.1.10", "port": 3053}]
      }
    ]
  },

  "loggers": [
    {
      "name": "kea-dhcp-ddns",
      "output-options": [
        {
          "output": "/var/log/kea/kea-ddns.log",
          "maxsize": 10485760,
          "maxver": 5
        }
      ],
      "severity": "INFO",
      "debuglevel": 0
    }
  ]
}
}
