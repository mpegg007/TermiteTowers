{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": ["eno1"]
        },
        "control-socket": {
            "socket-type": "unix",
            "socket-name": "/var/run/kea/kea4-ctrl-socket"
        },
        "lease-database": {
            "type": "memfile",
            "persist": true,
            "name": "/var/lib/kea/kea-leases4.csv"
        },
        "hosts-database": {
            "type": "postgresql",
            "name": "ttdb_dev1",
            "user": "kea",
            "password": "termitetowers-db",
            "host": "localhost"
        },  
        "expired-leases-processing": {
            "reclaim-timer-wait-time": 10,
            "flush-reclaimed-timer-wait-time": 25,
            "hold-reclaimed-time": 3600,
            "max-reclaim-leases": 100,
            "max-reclaim-time": 250,
            "unwarned-reclaim-cycles": 5
        },
        "dhcp-ddns": {
            "enable-updates": true,
            "server-ip": "192.168.1.10",
            "server-port": 53001,
            "sender-ip": "",
            "sender-port": 0,
            "max-queue-size": 1024,
            "ncr-protocol": "UDP",
            "ncr-format": "JSON"
        },
        "ddns-send-updates": true,
        "ddns-override-no-update": true,
        "ddns-override-client-update": true,
        "ddns-replace-client-name": "always",
        "ddns-generated-prefix": "dhcp",
        "ddns-qualifying-suffix": "kea.tt.omp",
        "hostname-char-set": "[^A-Za-z0-9.-]",
        "hostname-char-replacement": "",
        "renew-timer": 900,
        "rebind-timer": 1800, 
        "valid-lifetime": 3600,
        "option-data": [
            {
                "name": "domain-name-servers",
                "data": "192.168.1.10, 192.168.1.1"
            },
            {
                "name": "domain-name",
                "data": "tt.omp"
            },
            {
                "name": "domain-search",
                "data": "tt.omp, aa.omp, omp"
            },
            {
                "name": "routers",
                "data": "192.168.1.1"
            },
            {
                "name": "broadcast-address",
                "data": "192.168.1.255"
            }
        ],
        "subnet4": [
            {
                "id": 1,
                "subnet": "192.168.1.0/24",
                "comment": "Multi-scope DHCP configuration for TermiteTowers",
                "pools": [
                    {
                        "comment": "Dynamic-Clients: Mobile devices, guests",
                        "pool": "192.168.1.200 - 192.168.1.249",
                        "option-data": [
                            {
                                "name": "domain-name",
                                "data": "guests.termitetowers.local"
                            }
                        ]
                    }
                ],
                "option-data": [
                    {
                        "name": "routers", 
                        "data": "192.168.1.1"
                    }
                ]
            }
        ],
        "hooks-libraries": [
            {
                "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
            },
            {
                "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_host_cmds.so"
            },
            {
                "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so"
            }
        ],
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output_options": [
                    {
                        "output": "/var/log/kea/kea-dhcp4.log",
                        "maxsize": 10485760,
                        "maxver": 5
                    }
                ],
                "severity": "INFO",
                "debuglevel": 0
            }
        ]
    }
}
