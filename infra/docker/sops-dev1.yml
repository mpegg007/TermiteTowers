# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: sops-dev1
services:
  sops:
    image: mozilla/sops:latest
    container_name: sops-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3510:3000"
    env_file:
      - ./env/sops.env
    volumes:
      - /mnt/ai_storage/sops/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1
# Docker external network definition
networks:
  app-services-net-dev1:
    external: true
