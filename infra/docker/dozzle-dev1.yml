# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: dozzle-dev1

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3710:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - TZ=UTC
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - monitor-apps-net-dev1
networks:
  monitor-apps-net-dev1:
    external: true

# Usage:
#   docker compose -f infra/docker/dozzle-dev1.yml up -d
