name: homepage-dev1
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage-dev1
    restart: always
    ports:
      - "3360:3000"  # Correct port mapping for Homepage
    environment:
      - PUID=2003
      - PGID=976
      - TZ=America/New_York
      - BASE_URL=http://homepage.termitetowers.ca
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3360,homepage.termitetowers.ca
      # Add other Homepage environment variables as needed
    networks:
      - app-services-net-dev1
    volumes:
      - /mnt/ai_storage/docker/homepage-data/config:/app/config
      - /mnt/ai_storage/docker/homepage-data/images:/app/images
networks:
  app-services-net-dev1:
    external: true


