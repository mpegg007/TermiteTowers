name: mealie-dev1

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie-dev1
    restart: unless-stopped
    ports:
      - "3301:9000"  # Correct port mapping for Mealie
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - BASE_URL=http://mealie.termitetowers.ca
      # Add other Mealie environment variables as needed
    networks:
      - app-services-net-dev1
networks:
  app-services-net-dev1:
    external: true
