name: freshrss-dev1
services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss-dev1
    restart: always
    ports:
      - "3250:80"  # Correct port mapping for freshrss
    environment:
      - PUID=2004
      - PGID=975
      - TZ=America/Toronto
      - BASE_URL=http://news.termitetowers.ca
      - FRESHRSS_ALLOWED_HOSTS=localhost:3250,news.termitetowers.ca
      # Add other FreshRSS environment variables as needed
    networks:
      - app-services-net-dev1
    volumes:
      - /mnt/ai_storage/docker/freshrss-data/data:/var/www/FreshRSS/data
      - /mnt/ai_storage/docker/freshrss-data/extensions:/var/www/FreshRSS/extensions
networks:
  app-services-net-dev1:
    external: true



