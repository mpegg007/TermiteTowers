name: netalertx-dev1

services:
  netalertx:
    image: jokobsk/netalertx:latest
    container_name: netalertx-dev1
    restart: always
    network_mode: host

    # Restored to allow initial raw network socket hooks
    user: "0:0"

    read_only: true                                 # Make the container filesystem read-only
    # Secures the container execution by stripping unused Linux kernel capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
  
    # Environment variables for timezone, application port, and primary network interface for arp-scan
    environment:
      - TZ=America/Toronto
      - PORT=3731                  # UI accessible at http://<host-ip>:3731
      - NETALERTX_IFACE=eno1       # Set primary interface for physical arp-scan execution
      - SKIP_SYSCTL=true          # Prevents the container from attempting host network modifications
      # Tells the application to isolate itself to your specific user mapping during execution
      - PUID=20211
      - PGID=20211
      # Explicitly forces the backend scanner to target both physical adapters
      - SETTING_NETALERTX_IFACE=eno1
    volumes:
      # Consolidated single volume mount for the new container architecture
      - /mnt/ai_storage/netalertx:/data

    # Mounts a single, unrestricted 128MB RAM disk over the entire /tmp root tree
    tmpfs:
      - /tmp:size=128M,uid=20211,gid=20211,mode=1777
      
    # Resource limits to prevent resource exhaustion
    mem_limit: 2048m            # Maximum memory usage
    mem_reservation: 1024m      # Soft memory limit
    cpu_shares: 512             # Relative CPU weight for CPU contention scenarios
    pids_limit: 512             # Limit the number of processes/threads to prevent fork bombs
    
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# Updated Usage with exact 20211 App IDs:
#   sudo mkdir -p /mnt/ai_storage/netalertx/{config,data,db,logs} && \
