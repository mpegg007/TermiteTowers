# Scrape health -- does the monitoring itself still work.
#
# A monitoring stack that fails silently is worse than none: the absence of
# alerts reads as "everything is fine". These rules make the stack report on
# itself.

groups:
  - name: scrape
    rules:
      # Every target except Prometheus scraping itself. Prometheus being up but
      # unable to reach others is exactly the case worth catching.
      - alert: TargetDown
        expr: |
          up{job!="prometheus"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} has been down 15m"
          description: >-
            Prometheus cannot scrape this target. For job=node, host metrics and
            therefore every disk alert are blind. For job=docker, container
            alerts are blind. Both need fixing even though nothing is "down"
            from a user's point of view.

      - alert: PrometheusRuleEvaluationSlow
        expr: |
          prometheus_rule_group_last_duration_seconds > prometheus_rule_group_interval_seconds
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rule group {{ $labels.rule_group }} takes longer than its interval"
          description: >-
            Evaluation is falling behind schedule, which delays every alert in
            that group. Usually an expensive query rather than a load problem.

      - alert: PrometheusTSDBLowSpace
        expr: |
          predict_linear(prometheus_tsdb_storage_blocks_bytes[6h], 7 * 86400) >
          (node_filesystem_avail_bytes{mountpoint="/prometheus"} or vector(0))
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB growth will exhaust its filesystem within 7 days"
          description: >-
            Metrics storage is growing faster than free space. Retention is
            capped at 30d/5GB, so this usually means the cap is set above what
            the pool can spare. Metrics are disposable - lower the cap rather
            than growing the pool.
