# Backup alerts -- fed by scripts/emit-backup-metrics.sh via the node-exporter
# textfile collector.
#
# These measure what is actually on disk, not what a job reported. A backup that
# "succeeded" but wrote nothing still shows up here as stale, because the metric
# is derived from file mtimes in the backup directory.
#
# The 26-hour threshold allows a daily 03:30 job to miss one run before alerting,
# without letting a week of silence pass as normal.

groups:
  - name: backups
    rules:
      - alert: BackupStale
        expr: |
          time() - tt_backup_last_success_timestamp_seconds > 93600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.job }} is {{ $value | humanizeDuration }} old"
          description: >-
            No new backup file has appeared in {{ $labels.job }} for more than
            26 hours. Check the timer and the last exit status before assuming
            any data is current:
              systemctl status tt-backup-{{ $labels.job }}.timer
              systemctl status tt-backup-{{ $labels.job }}.service

      # absent() is the important half: without it, deleting the metric emitter
      # would silently remove every backup alert rather than raising one.
      - alert: BackupMetricsMissing
        expr: |
          absent(tt_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No backup metrics are being published"
          description: >-
            tt_backup_last_success_timestamp_seconds does not exist, so backup
            staleness cannot be evaluated at all. Check that
            tt-prometheus-metrics.timer has run and that the textfile directory
            is readable by node-exporter.

      - alert: BackupEmitterStale
        expr: |
          time() - tt_backup_emit_timestamp_seconds > 7200
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Backup metric emitter last ran {{ $value | humanizeDuration }} ago"
          description: >-
            The emitter is expected every 15 minutes. Its own heartbeat is stale,
            so the freshness numbers it publishes should not be trusted: they
            will be frozen at their last values rather than updating.

      - alert: BackupMetricUnreadable
        expr: |
          node_textfile_scrape_error > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter cannot read a textfile metric on {{ $labels.instance }}"
          description: >-
            The textfile collector reported an error. Usually a permissions
            mismatch: the emitting unit and node-exporter must both be able to
            read the directory, and metric files must be world-readable.
