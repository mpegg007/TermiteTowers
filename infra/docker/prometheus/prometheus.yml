# Prometheus configuration -- dev1
#
# SOURCE OF TRUTH. This directory is mounted read-only at /etc/prometheus in
# prometheus-dev1 (see infra/docker/prometheus-dev1.yml). Do not hand-edit
# /mnt/ai_storage/prometheus/config on the host: that copy is no longer used,
# and the previous setup generated it from a heredoc in
# scripts/deploy-prometheus-tensorflow.sh, so any hand-fix there was silently
# lost the next time that script ran.
#
# Reload after a change without restarting:
#   scripts/deploy-prometheus.sh
# which POSTs to /-/reload (enabled by --web.enable-lifecycle) and prints
# target health. Verify with:
#   curl -s http://127.0.0.1:3720/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health: .health}'
#
# No `alerting:` block by design. Alertmanager is deliberately not deployed:
# rules are evaluated here and their state is readable from ALERTS, while
# delivery is handled by scripts/tt-prometheus-alerts.sh through ttmail.
# See plans/prometheus-useful.md for the reasoning.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: termitetowers
    environment: dev1

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself. Proves the process is alive and records its own
  # scrape/TSDB health; it is the cheapest possible canary.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics: filesystem capacity (the reason this stack exists), memory,
  # load, and systemd unit state via node-exporter's systemd collector.
  #
  # The target is the CONTAINER NAME on monitor-apps-net-dev1, not localhost.
  # The previous value "localhost:9100" resolved to the prometheus container
  # itself, so it could never have worked even with node-exporter running.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: monolith

  # Docker engine metrics, enabled by "metrics-addr": "172.17.0.1:9323" in
  # /etc/docker/daemon.json.
  #
  # 172.17.0.1 is the docker0 gateway: reachable from containers on other
  # bridges, and deliberately NOT on the LAN. The endpoint has no
  # authentication, so it must not be bound to 0.0.0.0.
  #
  # host.docker.internal is not usable here: it maps to the compose network's
  # gateway (10.10.64.1), not docker0, so it would not reach a docker0-bound
  # listener.
  - job_name: docker
    static_configs:
      - targets: ["172.17.0.1:9323"]
