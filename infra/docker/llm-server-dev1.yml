# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: llm-server-dev1

services:
  llm-server:
    build:
      context: /home/mpegg-adm/source/llm-server
      dockerfile: Dockerfile
    image: llm-server:dev1
    container_name: llm-server-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3350:8000"
    environment:
      - TZ=UTC
      - SEARXNG_URL=https://search.termitetowers.ca
      - LLM_API_URL=https://ollama.termitetowers.ca/v1/chat/completions
      - HOME_ASSISTANT_URL=http://homeassistant.local:8123/api/webhook
    volumes:
      - /mnt/ai_storage/llm-server/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
        - ai-services-net-dev1
networks:
  ai-services-net-dev1:
    external: true
