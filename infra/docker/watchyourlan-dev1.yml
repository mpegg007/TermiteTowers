name: watchyourlan-dev1
services:
  watchyourlan:
    image: aceberg/watchyourlan:latest
    container_name: watchyourlan-dev1
    restart: always
    network_mode: host
    env_file:
      # Tiered absolute path: /etc/tt-secrets/<tier>/env/. A relative ./env/ here
      # resolves against the live project directory (/srv/dev1/watchyourlan/docker)
      # and only reached the secret through a three-hop symlink chain, and a
      # deployed tree built from tracked files alone has no ./env/ at all.
      - /etc/tt-secrets/dev1/env/watchyourlan.env
    environment:
      - TZ=America/Toronto
      - IFACE="eno1 wlp9s0 enx00e04c70432a"
      - TIMEOUT=120
      - PORT=3730
      - DBTYPE=postgres
    volumes:
      - /mnt/ai_storage/watchyourlan/data:/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
