name: watchyourlan-dev1
services:
  watchyourlan:
    image: aceberg/watchyourlan:latest
    container_name: watchyourlan-dev1
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./env/watchyourlan.env
    environment:
      - TZ=America/Toronto
      - IFACE="eno1 wlp9s0 enx00e04c70432a"
      - TIMEOUT=120
      - PORT=3730
      - DBTYPE=postgres
    volumes:
      - /mnt/ai_storage/watchyourlan/data:/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
