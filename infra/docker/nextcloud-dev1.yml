# Nextcloud — Postgres backend, user data on the gallery array.
#
# Public name is filebank.analacres.ca (see infra/nginx/sites-available/nextcloud.conf).
# Internal identity stays "nextcloud": container, ZFS dataset, database, env file.
#
# Mount map, and why each one exists:
#   /var/www/html         image-managed code, rewritten by every upgrade   -> NVMe
#   /var/www/html/config  instance config, restored beside the DB dump     -> NVMe
#   /var/www/html/custom_apps  installed apps                              -> NVMe
#   /var/www/html/data    user data: bulk, irreplaceable, Jotta-covered    -> gallery array
#   /var/log/nextcloud    application log, must never live in the data dir -> NVMe
#
# Ownership contract: /gallery/nextcloud/data is www-data:tt-ai-storage (33:1006)
# with the setgid bit on directories. Nextcloud writes 0644 files / 0755 dirs, so
# inherited group tt-ai-storage makes them readable by jottad, which runs as
# mpegg-adm (member of tt-ai-storage, not of tt-backup). Verified by canary, not assumed.
#
# The image is deliberately NOT run as a non-root user: the apache entrypoint is
# built around starting as root, and setgid on the mount achieves the same contract
# with no entrypoint risk. Measured 2026-11-08 — see plans/nextcloud-storage-and-jotta.md §6.

name: nextcloud-dev1
services:
  nextcloud:
    image: nextcloud:32.0.5-apache
    container_name: nextcloud-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3230:80"
    env_file:
      - ./env/nextcloud.env
    volumes:
      - /mnt/ai_storage/nextcloud/data:/var/www/html
      - /mnt/ai_storage/nextcloud/config:/var/www/html/config
      - /mnt/ai_storage/nextcloud/custom_apps:/var/www/html/custom_apps
      - /gallery/nextcloud/data:/var/www/html/data
      - /mnt/ai_storage/nextcloud/log:/var/log/nextcloud
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/status.php') === false ? 1 : 0);"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1

networks:
  app-services-net-dev1:
    external: true
