name: nextcloud-dev1
services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3230:80"
    env_file:
      - ./env/nextcloud.env
    volumes:
      - /mnt/ai_storage/nextcloud/data:/var/www/html
      - /mnt/ai_storage/nextcloud/config:/var/www/html/config
      - /mnt/ai_storage/nextcloud/custom_apps:/var/www/html/custom_apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1

networks:
  app-services-net-dev1:
    external: true
