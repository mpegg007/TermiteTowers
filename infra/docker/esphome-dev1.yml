name: esphome-dev1

services:
  esphome:
    image: esphome/esphome:latest
    container_name: esphome-dev1
    restart: always
    network_mode: host
    #ports:
    #  - "0.0.0.0:3320:6052"
    volumes:
      - /home/mpegg-adm/source/TermiteTowers/hams/esphome:/config
      - /mnt/ai_storage/esphome/.esphome:/mnt/ai_storage/esphome/.esphome
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

