name: ha-mcp-dev1

services:
  ha-mcp:
    image: ghcr.io/homeassistant-ai/ha-mcp:latest
    container_name: ha-mcp-dev1
    command: ha-mcp-web
    # Absolute path: secrets are not in git, so they are not in the deployed
    # tree either. See scripts/secrets-migrate-to-etc.sh
    env_file:
      - /etc/tt-secrets/env/ha-mcp.env
    environment:
      - HAMCP_BACKUP_DIR=/home/mcpuser/.ha-mcp/backups
    ports:
      - "0.0.0.0:3340:8086"
    volumes:
      - /mnt/ai_storage/ha-mcp/data:/home/mcpuser/.ha-mcp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1

networks:
  app-services-net-dev1:
    external: true

