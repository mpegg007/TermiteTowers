name: calendars-dev1
services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3320:5232"
    volumes:
      - /mnt/ai_storage/calendars/radicale:/data
      - ./radicale/config:/config
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5232"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-services-net-dev1

  vdirsyncer_google:
    image: python:3.11-slim
    container_name: vdirsyncer-google-dev1
    restart: unless-stopped
    volumes:
      - ./vdirsyncer/google:/config
      - /mnt/ai_storage/calendars/vdirsyncer_google_cache:/cache
    command: ["sh", "-c", "pip install vdirsyncer google-api-python-client && vdirsyncer sync"]
    environment:
      - TZ=${TZ}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_USER=${GOOGLE_USER}
      - GOOGLE_PASSWORD=${GOOGLE_PASSWORD}
    depends_on:
      - radicale
    healthcheck:
      test: ["CMD", "vdirsyncer", "--version"]
      interval: 1m
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - app-services-net-dev1
    env_file:
      - ./env/calendars.env

  vdirsyncer_outlook:
    image: python:3.11-slim
    container_name: vdirsyncer-outlook-dev1
    restart: unless-stopped
    volumes:
      - ./vdirsyncer/outlook:/config
      - /mnt/ai_storage/calendars/vdirsyncer_outlook_cache:/cache
    command: ["sh", "-c", "pip install vdirsyncer O365 && vdirsyncer sync"]
    environment:
      - TZ=${TZ}
      - OUTLOOK_CLIENT_ID=${OUTLOOK_CLIENT_ID}
      - OUTLOOK_CLIENT_SECRET=${OUTLOOK_CLIENT_SECRET}
      - OUTLOOK_USER=${OUTLOOK_USER}
      - OUTLOOK_PASSWORD=${OUTLOOK_PASSWORD}
    depends_on:
      - radicale
    healthcheck:
      test: ["CMD", "vdirsyncer", "--version"]
      interval: 1m
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - app-services-net-dev1
    env_file:
      - ./env/calendars.env

networks:
  app-services-net-dev1:
    external: true
