name: dbgate-dev1

services:
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate-dev1
    restart: always
    ports:
      - "0.0.0.0:3600:3000"  # Exposes DbGate on port 3600
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
       - app-services-net-dev1
networks:
  app-services-net-dev1:
    external: true
