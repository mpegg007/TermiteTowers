# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: kitchenowl-dev1

services:
  kitchenowl:
    image: tombursch/kitchenowl:latest
    container_name: kitchenowl-dev1
    restart: unless-stopped
    user: "${UID_SVC:-2001}:${GID_TT_AI:-1006}"
    ports:
      - "0.0.0.0:3300:8080"
    environment:
      - JWT_SECRET_KEY=${KITCHENOWL_JWT_SECRET:-PLEASE_CHANGE_ME}
      # - FRONT_URL=https://kitchenowl.termitetowers.ca # Optional; see docs for advanced config
    volumes:
      - /mnt/ai_storage/kitchenowl/data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - productivity-apps-net-dev1
networks:
  productivity-apps-net-dev1:
    external: true

# Usage:
#   KITCHENOWL_JWT_SECRET=$(openssl rand -hex 32) \
#   docker compose -f infra/docker/kitchenowl-dev1.yml up -d
