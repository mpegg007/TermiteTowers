# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: snipeit-dev1

services:
  snipeit-db:
    image: mariadb:10.11
    container_name: snipeit-db-dev1
    restart: unless-stopped
    env_file:
      - ./env/snipeit.env
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_DATABASE=snipeit
      - MYSQL_USER=snipeit
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - /mnt/ai_storage/snipeit/mysql:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1

  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit-dev1
    restart: unless-stopped
    depends_on:
      - snipeit-db
    ports:
      - "0.0.0.0:3900:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:ekmQ38LDVh9ff5/JaSvOuzyWrQVAlWnLsf32WpN9eWc=
      - APP_URL=https://asset.termitetowers.ca
      - APP_TIMEZONE=UTC
      - APP_LOCALE=en
      - DB_CONNECTION=mysql
      - DB_HOST=snipeit-db
      - DB_PORT=3306
      - DB_DATABASE=snipeit
      - DB_USERNAME=snipeit
      - DB_PASSWORD_FILE=/run/secrets/mysql_password
      - MAIL_DRIVER=smtp
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
      - QUEUE_DRIVER=sync
      - LOG_CHANNEL=single
    secrets:
      - mysql_password
    volumes:
      - /mnt/ai_storage/snipeit/data:/var/lib/snipeit
      - /mnt/ai_storage/snipeit/logs:/var/www/html/storage/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1
# Docker external network definition
networks:
  app-services-net-dev1:
    external: true

secrets:
  mysql_root_password:
    file: ./env/snipeit_mysql_root_password.txt
  mysql_password:
    file: ./env/snipeit_mysql_password.txt

