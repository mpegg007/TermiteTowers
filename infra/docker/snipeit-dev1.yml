name: snipeit-dev1

services:
  snipeit-db:
    image: mariadb:10.11
    container_name: snipeit-db-dev1
    restart: always
    env_file:
      # Tiered absolute path (see plans/per-tier-secrets.md §7a).
      - /etc/tt-secrets/dev1/env/snipeit.env
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - /mnt/ai_storage/snipeit/mysql:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1

  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit-dev1
    restart: unless-stopped
    env_file:
      - /etc/tt-secrets/dev1/env/snipeit.env
    depends_on:
      - snipeit-db
    ports:
      - "0.0.0.0:3900:80"
    environment:
      - DB_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - mysql_password
    volumes:
      - /mnt/ai_storage/snipeit/data:/var/lib/snipeit
      - /mnt/ai_storage/snipeit/logs:/var/www/html/storage/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1
# Docker external network definition
networks:
  app-services-net-dev1:
    external: true

secrets:
  # Moved out of the checkout: these were real files at mode 755 in git's
  # working tree. They feed MariaDB initialisation, so the bytes must never
  # change for an existing datadir - they were copied and sha256-verified, not
  # regenerated.
  mysql_root_password:
    file: /etc/tt-secrets/dev1/secrets/snipeit_mysql_root_password.txt
  mysql_password:
    file: /etc/tt-secrets/dev1/secrets/snipeit_mysql_password.txt

# Usage (first provision only):
#   sudo mkdir -p /mnt/ai_storage/snipeit/{mysql,data,logs} && \
#   sudo install -d -o root -g mpegg-adm -m 0750 /etc/tt-secrets/dev1/secrets && \
#   openssl rand -base64 32 | sudo tee /etc/tt-secrets/dev1/secrets/snipeit_mysql_root_password.txt >/dev/null && \
#   openssl rand -base64 32 | sudo tee /etc/tt-secrets/dev1/secrets/snipeit_mysql_password.txt >/dev/null && \
#   sudo chmod 640 /etc/tt-secrets/dev1/secrets/snipeit_mysql_*.txt && \
#   docker compose -f infra/docker/snipeit-dev1.yml up -d
#
# WARNING: the two openssl lines above generate NEW passwords. Run them only
# against an EMPTY datadir. On an existing /mnt/ai_storage/snipeit/mysql the
# credentials are already baked into the MariaDB user table, so regenerating
# them here locks Snipe-IT out of its own database and the app returns 500.
# To rotate on a live install, change the password inside MariaDB first, then
# update these files, keeping them byte-identical to what the DB expects.
# These files live in /etc/tt-secrets/<tier>/secrets/, never in the checkout.
