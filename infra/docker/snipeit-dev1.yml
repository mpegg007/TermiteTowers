name: snipeit-dev1

services:
  snipeit-db:
    image: mariadb:10.11
    container_name: snipeit-db-dev1
    restart: unless-stopped
    env_file:
      - ./env/snipeit.env
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - /mnt/ai_storage/snipeit/mysql:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1

  snipeit:
    image: snipe/snipe-it:latest
    container_name: snipeit-dev1
    restart: unless-stopped
    env_file:
      - ./env/snipeit.env
    depends_on:
      - snipeit-db
    ports:
      - "0.0.0.0:3900:80"
    environment:
      - DB_PASSWORD_FILE=/run/secrets/mysql_password
    secrets:
      - mysql_password
    volumes:
      - /mnt/ai_storage/snipeit/data:/var/lib/snipeit
      - /mnt/ai_storage/snipeit/logs:/var/www/html/storage/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app-services-net-dev1
# Docker external network definition
networks:
  app-services-net-dev1:
    external: true

secrets:
  mysql_root_password:
    file: ./env/snipeit_mysql_root_password.txt
  mysql_password:
    file: ./env/snipeit_mysql_password.txt

