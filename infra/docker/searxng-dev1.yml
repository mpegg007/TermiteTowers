# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: searxng-dev1

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-dev1
    restart: unless-stopped
    ports:
      - "0.0.0.0:3130:8080"
    environment:
      - TZ=UTC
      - SEARXNG_BASE_URL=https://search.termitetowers.ca/
    volumes:
      - /mnt/ai_storage/searxng/data:/etc/searxng
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - monitor-apps-net-dev1
# Docker external network definition
networks:
  monitor-apps-net-dev1:
    external: true

# Usage:
#   sudo mkdir -p /mnt/ai_storage/searxng/data && \
#   sudo chown -R 2001:1006 /mnt/ai_storage/searxng && \
#   sudo chmod -R u+rwX,g+rwX /mnt/ai_storage/searxng && \
#   docker compose -f /home/mpegg-adm/source/TermiteTowers/infra/docker/searxng-dev1.yml up -d
