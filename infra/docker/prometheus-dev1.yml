# Prometheus - Monitoring and Alerting System
# Purpose: Time-series database and monitoring solution for metrics collection
# Access: https://prometheus.termitetowers.ca
# Port: 3720 (host) -> 9090 (container)
# Category: Monitoring & Ops (3700-3799 range per wiki/ports.md)
name: prometheus-dev1

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev1
    restart: always
    
    # Loopback only. nginx is the only intended client: the Prometheus API has
    # no authentication of its own, and serving it on 0.0.0.0 let the LAN reach
    # /api/v1/* and the lifecycle reload endpoint while bypassing the vhost.
    ports:
      - "127.0.0.1:3720:9090"
    
    environment:
      - TZ=America/New_York
    
    volumes:
      - /mnt/ai_storage/prometheus/data:/prometheus
      # Config is repo-managed and mounted read-only: the repo is the source of
      # truth, so a host copy can never drift from it again. Edit
      # infra/docker/prometheus/ and run scripts/deploy-prometheus.sh.
      # TSDB data stays on the host, writable, since it is runtime state.
      - /home/mpegg-adm/source/TermiteTowers/infra/docker/prometheus:/etc/prometheus:ro
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      # Time-only retention has no upper bound on a pool shared with the data it
      # is watching. Whichever limit is hit first wins.
      - '--storage.tsdb.retention.size=5GB'
      # Console library/template flags are dropped: those directories are not in
      # the repo-managed config mount, and the bundled consoles are vestigial
      # (the UI's own Graph tab is what gets used).
      #
      # enable-lifecycle allows POST /-/reload, which scripts/deploy-prometheus.sh
      # uses. Safe to keep now that the listener is bound to loopback only.
      - '--web.enable-lifecycle'
    
    user: "2001:1006"
    
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    
    networks:
      - monitor-apps-net-dev1

# Docker external network definition
networks:
  monitor-apps-net-dev1:
    external: true

# Setup Instructions:
# 1. Create data directories:
#   sudo mkdir -p /mnt/ai_storage/prometheus/{data,config}
#   sudo chown -R 2001:1006 /mnt/ai_storage/prometheus
#   sudo chmod -R u+rwX,g+rwX /mnt/ai_storage/prometheus
#
# 2. Create basic prometheus.yml config:
#   cat > /tmp/prometheus.yml << 'EOF'
#   global:
#     scrape_interval: 15s
#     evaluation_interval: 15s
#   
#   scrape_configs:
#     - job_name: 'prometheus'
#       static_configs:
#         - targets: ['localhost:9090']
#   EOF
#   sudo cp /tmp/prometheus.yml /mnt/ai_storage/prometheus/config/prometheus.yml
#   sudo chown 2001:1006 /mnt/ai_storage/prometheus/config/prometheus.yml
#
# 3. Start the container:
#   docker compose -f /home/mpegg-adm/source/TermiteTowers/infra/docker/prometheus-dev1.yml up -d
#
# 4. Setup Nginx reverse proxy (see wiki/how-to-add-docker-app.md section 6)
#
# 5. Create /srv/dev1 convenience symlink:
#   sudo mkdir -p /srv/dev1/prometheus/docker
#   sudo ln -sf /home/mpegg-adm/source/TermiteTowers/infra/docker/prometheus-dev1.yml /srv/dev1/prometheus/docker/prometheus-dev1.yml
#
# 6. Verify:
#   docker logs --tail 100 prometheus-dev1
#   curl http://127.0.0.1:3720/-/healthy
