# Prometheus - Monitoring and Alerting System
# Purpose: Time-series database and monitoring solution for metrics collection
# Access: https://prometheus.termitetowers.ca
# Port: 3720 (host) -> 9090 (container)
# Category: Monitoring & Ops (3700-3799 range per wiki/ports.md)
name: prometheus-dev1

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev1
    restart: always
    
    ports:
      - "0.0.0.0:3720:9090"
    
    environment:
      - TZ=America/New_York
    
    volumes:
      - /mnt/ai_storage/prometheus/data:/prometheus
      - /mnt/ai_storage/prometheus/config:/etc/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    user: "2001:1006"
    
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    
    networks:
      - monitor-apps-net-dev1

# Docker external network definition
networks:
  monitor-apps-net-dev1:
    external: true

# Setup Instructions:
