# tier-path-allowlist.conf — absolute paths that a `*-<tier>.yml` compose file
# may reference WITHOUT a tier segment in them.
#
# Consumed by scripts/check-tier-paths.py. Everything not matched here must
# contain the file's own tier as a path component, e.g. /mnt/ai_storage/dev1/...
#
# This file is the reviewed answer to the question "which sharing is
# intentional?" — it is not a suppression list. A path that is merely
# *currently* tier-less belongs in tier-path-baseline.txt as known debt, where
# it stays visible, not here.
#
# FORMAT
#   <glob> | <mode> | <reason>
#
#   glob   fnmatch pattern, matched against the WHOLE absolute path ('*' also
#          crosses '/', so /mnt/ai_storage/models/* covers nested files)
#   mode   ok      -> shared by design; any mount mode is acceptable
#          must-ro -> shared READ-ONLY only; a read-write mount is a violation
#   reason short justification, shown in the violation output
#
# Blank lines and lines starting with '#' are ignored.
# ---------------------------------------------------------------------------

# --- host clock / timezone ------------------------------------------------
/etc/localtime            | ok | host clock; identical for every container
/etc/timezone             | ok | host timezone; containers follow the host

# --- model caches --------------------------------------------------------
# Read-mostly, tens of GB each. Duplicating these per tier buys nothing:
# nothing in a cache directory is a source of truth for any service.
/mnt/ai_storage/models/*  | ok | shared model caches (huggingface, pip, torch, whisper)

# --- photo pools ---------------------------------------------------------
# One dataset by nature. Safe to share, but the tier that does not own the
# pool must not be able to write to it: a dev1 test must never mutate or
# prune the library. Mounted rw is therefore a violation.
/gallery/shares/*         | must-ro | photo pool shared across tiers; non-owner mounts ro
/gallery/nextcloud/data   | must-ro | nextcloud data dir; read-only for non-owner tiers

# --- docker API socket ---------------------------------------------------
# Accepted risk, recorded deliberately: ':ro' gates filesystem writes, not the
# Docker API. Anything holding this socket can stop ANY container on the host,
# prd included. There is no mount mode that makes it safe.
/var/run/docker.sock      | ok | accepted risk - full Docker control, ':ro' is not a sandbox

# --- metrics collection --------------------------------------------------
# node-exporter reads host state and writes nothing. These are properties of
# the host itself, so they are shared by design rather than duplicated per tier:
# there is one rootfs and one dbus socket, and every tier's scrape of them must
# agree. Both are must-ro, so a read-write mount of either is a violation.
/                         | must-ro | node-exporter host rootfs; statfs needs the real mount table, writes never
/run/dbus/system_bus_socket | must-ro | node-exporter systemd collector; read-only query of unit state

# Prometheus config, mounted read-only into the scraper. Tier-neutral by
# design: the tier is carried in external_labels, not in the path, and every
# tier scrapes an identically-shaped config.
/home/mpegg-adm/source/TermiteTowers/infra/docker/prometheus | must-ro | repo-managed prometheus config; tier-neutral and read-only
