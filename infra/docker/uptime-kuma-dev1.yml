name: uptime-kuma-dev1 

services:
  uptime-kuma:
    # PINNED, not floating. The old ':2' tag meant any restart could run an
    # unreviewed SQLite migration at an arbitrary moment, and a Kuma migration is
    # forward-only: there is no in-place rollback. Bump this deliberately, after
    # snapshotting /mnt/ai_storage/uptime-kuma/data. See wiki/runbook-uptime-kuma.md.
    # Upgraded 2026-11-13 from 2.4.0 (15 monitors, 24107 heartbeats, integrity ok).
    # The previous image is kept locally as louislam/uptime-kuma:2.4.0-rollback.
    image: louislam/uptime-kuma:2.5.11
    container_name: uptime-kuma-dev1
    restart: always
    ports:
      - "0.0.0.0:3700:3001"  # Standardized port for Uptime Kuma per ports.md
    volumes:
      - /mnt/ai_storage/uptime-kuma/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - monitor-apps-net-dev1
# Docker external network definition
networks:
  monitor-apps-net-dev1:
    external: true

# Usage:
#   sudo mkdir -p /mnt/ai_storage/uptime-kuma/data && \
#   sudo chown -R 2001:1006 /mnt/ai_storage/uptime-kuma && \
#   sudo chmod -R u+rwX,g+rwX /mnt/ai_storage/uptime-kuma && \
#   docker compose -f infra/docker/uptime-kuma-dev1.yml up -d
