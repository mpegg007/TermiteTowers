name: Deploy Production

on:
  push:
    branches:
      - prd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jah-prd-deploy
  cancel-in-progress: false

jobs:

  deploy:
    runs-on:
      - self-hosted
      - linux
      - tt-prd
    steps:
      - uses: actions/checkout@v4

      # MUST run before rsync: rsync --delete purges and overwrites in a single pass,
      # so this is the last moment the drifted bytes exist. Fatal on failure, skipped
      # when nothing is at risk. See scripts/deploy/tt-deploy-archive.sh.
      #
      # NOTE: this file is edited on dev1 and only takes effect once promotion puts it
      # on prd, because workflows run from the pushed ref.
      - name: Archive run-area drift before the deploy destroys it
        run: |
          extra=""
          if [ "${TT_ARCHIVE_BOOTSTRAP:-0}" = "1" ]; then
            echo "::warning::TT_ARCHIVE_BOOTSTRAP=1 — first recorded deploy, nothing will be archived"
            extra="--allow-bootstrap"
          fi
          bash scripts/deploy/tt-deploy-archive.sh \
            --run-area /srv/prd/tt \
            --state-dir /srv/prd $extra
        env:
          # See deploy-dev1.yml. In this repo, prd is the tier where a mistaken
          # bootstrap matters most, so the variable should be removed immediately
          # after the first recorded deploy, not left set.
          TT_ARCHIVE_BOOTSTRAP: ${{ vars.TT_ARCHIVE_BOOTSTRAP }}

      - name: Synchronize approved revision
        run: >-
          rsync -a --delete --exclude=.env --exclude=.venv --exclude=.git
          "$GITHUB_WORKSPACE/" /srv/prd/tt/

      # Runs before the dependency step on purpose: that step is expected-red by
      # design, and the record must still be written when the job concludes red.
      - name: Record deployed state
        run: |
          bash scripts/deploy/tt-deploy-record.sh \
            --run-area /srv/prd/tt \
            --state-dir /srv/prd \
            --commit "${GITHUB_SHA}"

      - name: Install production dependencies
        run: /srv/prd/tt/.venv/bin/python -m pip install -e /srv/prd/tt
