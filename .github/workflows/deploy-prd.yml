name: Deploy Production

on:
  push:
    branches:
      - prd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jah-prd-deploy
  cancel-in-progress: false

jobs:

  deploy:
    runs-on:
      - self-hosted
      - linux
      - tt-prd
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize approved revision
        run: >-
          rsync -a --delete --exclude=.env --exclude=.venv --exclude=.git
          "$GITHUB_WORKSPACE/" /srv/prd/tt/
      - name: Install production dependencies
        run: /srv/prd/tt/.venv/bin/python -m pip install -e /srv/prd/tt
