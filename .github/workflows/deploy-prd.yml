name: Deploy Production

on:
  push:
    branches:
      - prd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jah-prd-deploy
  cancel-in-progress: false

jobs:

  deploy:
    runs-on:
      - self-hosted
      - linux
      - tt-prd
    steps:
      - uses: actions/checkout@v4

      # PARKED 2026-11-13 - the archive and record steps are not wired in. See
      # deploy-dev1.yml for why: the state directory they need was the parent of the
      # run area, which the deploy user does not own (/srv/prd is root:root 0755 and
      # this job runs as tt-deploy), so the deploy record could never be written.
      #
      # NOTE: this file is edited on dev1 and only takes effect once promotion puts it
      # on prd, because workflows run from the pushed ref.
      - name: Synchronize approved revision
        run: >-
          rsync -a --delete --exclude=.env --exclude=.venv --exclude=.git
          "$GITHUB_WORKSPACE/" /srv/prd/tt/

      - name: Install production dependencies
        run: /srv/prd/tt/.venv/bin/python -m pip install -e /srv/prd/tt
