# Deploy the dev1 tree to /srv/dev1/tt.
#
# Same mechanism as deploy-prd.yml — a self-hosted runner rsyncs the workspace
# to a target directory on monolith. The differences are deliberate:
#
#   * branch is `dev1`, not `prd`
#   * destination is /srv/dev1/tt
#   * concurrency group is per-repo and per-environment. deploy-prd.yml says
#     `jah-prd-deploy`, a copy-paste artefact recorded in docs/status/progress.md;
#     that mistake is not repeated here.
#   * there is NO dependency-install step. The prd equivalent fails by design
#     (`pip install -e` against a repo with no root packaging) and is documented
#     as expected-red. Nothing in dev1 needs it.
#
# The runner is the repo's existing one, label `tt-prd`. A runner is bound to a
# repository, not to an environment, so the same agent serves both workflows; the
# label name predates dev1 and is kept because that is the label registered.
#
# KNOWN LIMITATION — read before pointing anything at this tree:
#   `.gitignore` excludes `infra/docker/env/*.env`, so this checkout has no
#   secrets. Compose files here reference `./env/<service>.env`, which will not
#   exist. Nothing should have its systemd unit repointed at /srv/dev1/tt until
#   secrets live in one root outside every checkout and are symlinked in.
#
# The rsync destination is a literal on purpose. `--delete` plus an interpolated
# path is how a tree gets emptied by a typo.

name: Deploy Development

on:
  push:
    branches:
      - dev1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tt-dev1-deploy
  cancel-in-progress: false

jobs:

  deploy:
    runs-on:
      - self-hosted
      - linux
      - tt-prd
    steps:
      - uses: actions/checkout@v4

      - name: Verify the deployment target exists and is the expected path
        run: |
          if [ ! -d /srv/dev1/tt ]; then
            echo "::error::/srv/dev1/tt does not exist. Create it with:"
            echo "::error::  sudo install -d -o tt-deploy -g tt-deploy -m 0755 /srv/dev1/tt"
            exit 1
          fi
          if [ ! -w /srv/dev1/tt ]; then
            echo "::error::/srv/dev1/tt is not writable by this runner's user."
            exit 1
          fi

      - name: Synchronize dev1 revision
        run: >-
          rsync -a --delete --exclude=.env --exclude=.venv --exclude=.git
          "$GITHUB_WORKSPACE/" /srv/dev1/tt/
