name: CI

on:
  push:
    branches:
      - dev1
  pull_request:
    branches:
      - dev1
      - prd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # This repo has no root Python package: only water-meter/ and ttmail/ are
      # installable, so `pip install -e .` at the root fails. Gate the package,
      # lint and test steps on a root pyproject.toml so CI is green today and
      # self-activates if a root package is ever added.
      - name: Install package with dev extras
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        if: hashFiles('pyproject.toml') != ''
        run: python -m ruff check .
      - name: Run tests
        if: hashFiles('pyproject.toml') != ''
        run: python -m pytest -q
