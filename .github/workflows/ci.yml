name: CI

on:
  push:
    branches:
      - dev1
  pull_request:
    branches:
      - dev1
      - prd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip

      # Tier separation of host paths. The compose project name, container
      # names and networks are already per tier, but every host bind mount is
      # tier-blind, so a *-prd1.yml copied from the dev1 file would mount dev1's
      # data directory. Ratcheted against infra/docker/tier-path-baseline.txt:
      # new violations fail, known debt is listed and shrinks over time.
      - name: Check tier path separation
        run: python3 scripts/check-tier-paths.py
      - name: Test tier-path checker
        run: bash tests/tier-paths/test_check_tier_paths.sh

      # Deliberately NOT running tests/deploy/test_deploy_state.sh: the deploy
      # manifest/archive machinery it covers is parked (2026-11-13) and no workflow
      # invokes it, so CI does not gate on work that is not in the deploy path.
      # Re-wire it when that work is resumed.

      # Prometheus config and alert rules, validated by promtool from the same
      # image the server runs, so a rule that parses here parses at runtime.
      # The conventions test covers what promtool cannot: that every alert is
      # deliverable (has severity and an annotation for the mail body), and that
      # the regressions this repo already suffered stay fixed - a localhost
      # scrape target, a public listener, and config generated by a script.
      - name: Validate Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/infra/docker/prometheus:/cfg:ro" \
            --entrypoint promtool prom/prometheus:latest \
            check config /cfg/prometheus.yml
          docker run --rm -v "$PWD/infra/docker/prometheus:/cfg:ro" \
            --entrypoint sh prom/prometheus:latest \
            -c 'promtool check rules /cfg/rules/*.yml'
      - name: Test Prometheus conventions
        run: bash tests/prometheus/test_prometheus_config.sh

      # This repo has no root Python package: only water-meter/ and ttmail/ are
      # installable, so `pip install -e .` at the root fails. Gate the package,
      # lint and test steps on a root pyproject.toml so CI is green today and
      # self-activates if a root package is ever added.
      - name: Install package with dev extras
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        if: hashFiles('pyproject.toml') != ''
        run: python -m ruff check .
      - name: Run tests
        if: hashFiles('pyproject.toml') != ''
        run: python -m pytest -q
